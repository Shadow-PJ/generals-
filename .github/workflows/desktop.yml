# Builds the desktop app for each system and checks it, attaching each build to the run as a
# download (Actions > this run > Artifacts). Runs on every merge to main and on pull requests,
# so a build can be tried before merging.
# - windows: the installer, built on Windows, installed silently, checked to play and to keep
#   your card after a restart.
# - linux (session 6C): the AppImage for Linux PCs and the Steam Deck, checked the same way on a
#   virtual screen.
name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # electron-builder downloads its own copy of Electron for packaging.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the installer
        run: npm run desktop:installer
        env:
          # The multiplayer relay (session 6D): set the RELAY_URL repository variable once it is hosted.
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}

      - name: Install it the way a player would, silently
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'Generals-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer was built' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Generals.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Generals.exe was not installed' }
          Write-Output "Installed at $($exe.FullName)"
          "GENERALS_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Play - save a card and start a battle
        shell: pwsh
        timeout-minutes: 3
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke-play.log'
          $run = Start-Process -FilePath $env:GENERALS_EXE -ArgumentList '--smoke-test=play', "--smoke-log=$log" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($run.ExitCode -ne 0) { throw "Smoke test failed (exit code $($run.ExitCode))" }

      - name: Reopen - the card must still be in slot 1
        shell: pwsh
        timeout-minutes: 3
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke-reopen.log'
          $run = Start-Process -FilePath $env:GENERALS_EXE -ArgumentList '--smoke-test=reopen', "--smoke-log=$log" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($run.ExitCode -ne 0) { throw "Smoke test failed (exit code $($run.ExitCode))" }
          Get-ChildItem "$env:APPDATA\Generals" -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Generals-Windows-installer
          path: release/Generals-Setup-*.exe
          if-no-files-found: error

      # The experimental language model is optional and off by default, and warming it up on a
      # shared runner sometimes takes longer than the step allows. Its result stays visible in
      # the log and as a failed step, but it no longer fails the build.
      - name: Order model in the desktop app - download it, warm it up, then read 2 free-form orders
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke-model.log'
          $run = Start-Process -FilePath $env:GENERALS_EXE -ArgumentList '--smoke-test=model', '--smoke-model=qwen2.5-0.5b', "--smoke-log=$log" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($run.ExitCode -ne 0) { throw "Model smoke test failed (exit code $($run.ExitCode))" }

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Runners have no FUSE: the AppImage unpacks itself to a temporary folder instead.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the AppImage
        run: npm run desktop:linux
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - name: A virtual screen for the game window
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # The runner's kernel doesn't let Chromium build its sandbox, so the checks run without it;
      # players' systems (the Steam Deck's included) have it.
      - name: Play - save a card and start a battle
        timeout-minutes: 3
        run: |
          app=$(ls release/Generals-*-x86_64.AppImage)
          xvfb-run -a "$app" --no-sandbox --smoke-test=play --smoke-log="$RUNNER_TEMP/smoke-play.log" || status=$?
          cat "$RUNNER_TEMP/smoke-play.log" || true
          exit ${status:-0}
      - name: Reopen - the card must still be in slot 1
        timeout-minutes: 3
        run: |
          app=$(ls release/Generals-*-x86_64.AppImage)
          xvfb-run -a "$app" --no-sandbox --smoke-test=reopen --smoke-log="$RUNNER_TEMP/smoke-reopen.log" || status=$?
          cat "$RUNNER_TEMP/smoke-reopen.log" || true
          ls -R ~/.config/Generals
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        with:
          name: Generals-Linux-AppImage
          path: release/Generals-*-x86_64.AppImage
          if-no-files-found: error
