# The folders Steam takes (session 7A): the unpacked desktop app for Windows, and for Linux and
# the Steam Deck. Run it by hand (Actions > Steam builds > Run workflow) for a build you want on
# Steam. Each folder is packed as a .tar.gz, which keeps the Linux app's executable files
# executable. Unpack both into release/ and upload them with `npm run steam:upload` (see
# docs/store/steam/README.md). Nothing here signs in to Steam.
name: Steam builds

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            folder: win-unpacked
            name: Generals-Steam-Windows
          - os: ubuntu-latest
            folder: linux-unpacked
            name: Generals-Steam-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # electron-builder downloads its own copy of Electron for packaging.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the unpacked app
        run: npm run desktop:steam
        env:
          # The multiplayer relay (session 6D), from the RELAY_URL repository variable.
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - name: Pack it
        shell: bash
        run: tar -czf "release/${{ matrix.name }}.tar.gz" -C release "${{ matrix.folder }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/${{ matrix.name }}.tar.gz
          if-no-files-found: error
