# Packaging for the Windows installer (`npm run desktop:installer`) and the Linux AppImage for
# Steam Deck and other Linux PCs (`npm run desktop:linux`, session 6C). Both land in release/.
appId: io.github.shadowpj.generals
productName: Generals
copyright: Copyright © 2026 Shadow-PJ
directories:
  output: release
# The app needs only the game build and the compiled main process; Vite already bundled Phaser.
# Its two runtime packages come along as production dependencies: steamworks.js (session 7A),
# whose native module and Steam's own library stay outside app.asar so they can load, keeping
# only the ones for the platform being built; and koffi (session 7B), which calls Epic's SDK,
# whose native module (in @koromix/koffi-<platform>, installed only for the platform building)
# stays outside too, without its C++ sources and docs.
files:
  - package.json
  - dist/**/*
  - desktop/build/**/*
  - '!node_modules/steamworks.js/dist/osx/**'
  - '!node_modules/steamworks.js/dist/win64/*.lib'
  - '!node_modules/koffi/{doc,lib,vendor}/**'
  - '!node_modules/koffi/src/koffi/src/**/*.{S,asm,cc,def,hh,inc}'
  - '!node_modules/koffi/src/koffi/CMakeLists.txt'
  - '!node_modules/koffi/{cnoke.cjs,CHANGELOG.md}'
  - '!node_modules/@koromix/*/musl_*/**'
asarUnpack:
  - node_modules/steamworks.js/dist/**
  - node_modules/@koromix/**
icon: desktop/icon.png
win:
  target:
    - target: nsis
      arch: [x64]
  files:
    - '!node_modules/steamworks.js/dist/linux64/**'
nsis:
  # One click, installed for this Windows user only, so no admin prompt.
  oneClick: true
  perMachine: false
  artifactName: Generals-Setup-${version}.${ext}
  shortcutName: Generals
  # Uninstalling keeps your saves in %APPDATA%\Generals.
  deleteAppDataOnUninstall: false
linux:
  # One file that runs on any Linux PC, the Steam Deck's desktop mode included; Steam gets the
  # unpacked folder (release/linux-unpacked) instead, from `npm run desktop:steam` (session 7A).
  target:
    - target: AppImage
      arch: [x64]
  files:
    - '!node_modules/steamworks.js/dist/win64/**'
  category: Game
  # The window belongs to the app's menu entry (its icon and name in the task bar).
  syncDesktopName: true
  artifactName: Generals-${version}-x86_64.${ext}
